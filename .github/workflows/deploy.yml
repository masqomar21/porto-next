name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
      
      - name: Deploy to production server
        run: |
          ssh -o ConnectTimeout=10 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'DEPLOY_SCRIPT'
          
          cd /home/apps/porto
          
          # Fetch latest changes
          git fetch origin main
          git checkout main
          git pull origin main
          
          echo "✓ Git updated"
          
          # Install dependencies as httpsvr user
          sudo -u httpsvr source /home/httpsvr/.nvm/nvm.sh && npm ci
          
          echo "✓ Dependencies installed"
          
          # Build
          sudo -u httpsvr source /home/httpsvr/.nvm/nvm.sh && npm run build
          
          echo "✓ Build complete"
          
          # Restart PM2
          sudo -u httpsvr source /home/httpsvr/.nvm/nvm.sh && pm2 restart porto
          
          echo "✓ PM2 restarted"
          
          # Verify deployment
          sleep 2
          curl -s http://localhost:3000 | head -20
          
          echo "✅ Deployment successful"
          
          DEPLOY_SCRIPT
      
      - name: Notify deployment
        if: success()
        run: echo "✅ Porto deployed to production"
      
      - name: Deployment failed
        if: failure()
        run: echo "❌ Deployment failed - check logs above"

name: CI / CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ----------------------------------------------------
  # 1. CI Job: Lint & Build Testing
  # ----------------------------------------------------
  build-and-test:
    name: Lint & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Lint Application
        run: npm run lint

      - name: Build Test
        run: npm run build
        env:
          MONGODB_URI: "mongodb://localhost:27017/test"
          JWT_SECRET: "test-secret"
          RESEND_API_KEY: "test-key"

  # ----------------------------------------------------
  # 2. CD Job: Auto Deploy to VPS via SSH (Push on main only)
  # ----------------------------------------------------
  deploy:
    name: Deploy to Production VPS
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT != '' && secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            TARGET_USER="${{ secrets.DEPLOY_USER || secrets.VPS_USERNAME }}"

            sudo -i -u "$TARGET_USER" bash << 'EOF'
            set -e

            # Load NVM environment if available
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            echo "👤 Menjalankan deployment sebagai user target: $(whoami)!"
            echo "📦 Node version: $(node -v || true)"
            echo "📦 NPM version: $(npm -v || true)"

            cd /home/apps/porto

            # Reset local changes & pull main
            git fetch origin main
            git reset --hard origin/main

            npm install --production=false
            npm run build

            echo "🚀 Mereload proses PM2..."
            PM2_BIN="$(command -v pm2 || true)"
            if [ -z "$PM2_BIN" ]; then
              echo "pm2 not found. PATH=$PATH"
              exit 1
            fi

            if [ -f pm2.config.js ]; then
              "$PM2_BIN" reload pm2.config.js --update-env || "$PM2_BIN" start pm2.config.js
            else
              "$PM2_BIN" reload ecosystem.config.js --update-env || "$PM2_BIN" start ecosystem.config.js
            fi

            echo "✅ Deployment selesai dan sukses sebagai $(whoami)!"
            EOF

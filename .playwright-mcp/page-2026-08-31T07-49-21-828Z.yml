                - generic [ref=f1e153]:
                  - paragraph [ref=f1e154]: Printing to thermal receipt printers usually requires installing native desktop drivers or helper apps. However, modern web technologies now allow direct communication between the browser and hardware.
                  - paragraph [ref=f1e155]
                  - paragraph [ref=f1e156]: "### WebUSB vs Web Serial for Thermal Printers"
                  - paragraph [ref=f1e157]: "Two API options exist for browser-to-printer communication:"
                  - paragraph [ref=f1e158]: "- **WebUSB**: Provides low-level access to USB devices. Recommended for standard USB receipt printers."
                  - paragraph [ref=f1e159]: "- **Web Serial**: Provides access to serial ports. Best for older serial/RS-232 devices or microcontrollers."
                  - paragraph [ref=f1e160]
                  - paragraph [ref=f1e161]: WebUSB is generally preferred as most modern thermal printers connect via USB.
                  - paragraph [ref=f1e162]
                  - paragraph [ref=f1e163]: "### Understanding ESC/POS Commands"
                  - paragraph [ref=f1e164]: "Thermal printers speak **ESC/POS**, a command system developed by Epson. To print a receipt, we must send these raw binary bytes. For example:"
                  - paragraph [ref=f1e165]: "- **Initialize Printer**: `ESC @` (Hex `1B 40`)"
                  - paragraph [ref=f1e166]: "- **Print & Feed**: `LF` (Hex `0A`)"
                  - paragraph [ref=f1e167]: "- **Paper Cut**: `GS V` (Hex `1D 56`)"
                  - paragraph [ref=f1e168]
                  - paragraph [ref=f1e169]: Generating these binary arrays manually is tedious and error-prone.
                  - paragraph [ref=f1e170]
                  - paragraph [ref=f1e171]: "### Introducing `web-thermal-printer`"
                  - paragraph [ref=f1e172]: "To simplify receipt compilation and printing, we can use the open-source library [`web-thermal-printer`](https://github.com/masqomar21/web-thermal-printer)."
                  - paragraph [ref=f1e173]
                  - paragraph [ref=f1e174]: "#### Installation"
                  - paragraph [ref=f1e175]: "```bash"
                  - paragraph [ref=f1e176]: npm install web-thermal-printer
                  - paragraph [ref=f1e177]: "```"
                  - paragraph [ref=f1e178]

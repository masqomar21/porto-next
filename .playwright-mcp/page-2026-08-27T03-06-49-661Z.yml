                - generic [ref=f1e285]:
                  - heading "Introduction" [level=2] [ref=f1e324]
                  - paragraph [ref=f1e325]:
                    - strong [ref=f1e326]: web-thermal-printer
                    - text: is a lightweight, zero-configuration WebAssembly SDK that connects your web applications (React, Vue, Next.js, Angular, Svelte, or plain JS/TS) directly to ESC/POS Thermal Receipt Printers via Web USB or Web Serial API. No background desktop software installation is required on client machines!
                  - heading "Key Features" [level=2] [ref=f1e327]
                  - list [ref=f1e328]:
                    - listitem [ref=f1e329]:
                      - paragraph [ref=f1e330]:
                        - strong [ref=f1e331]: Zero-Config Embedded WASM
                        - text: ":"
                        - code [ref=f1e332]: printer.wasm
                        - text: is Base64 embedded inside the npm bundle. Call
                        - code [ref=f1e333]: await printer.init()
                        - text: without copying
                        - code [ref=f1e334]: .wasm
                        - text: files or configuring bundlers (Vite, Next.js, Webpack, etc.).
                    - listitem [ref=f1e335]:
                      - paragraph [ref=f1e336]:
                        - strong [ref=f1e337]: 100% TypeScript Ready
                        - text: ": Includes strict TypeScript type declarations ("
                        - code [ref=f1e338]: dist/index.d.ts
                        - text: ) out-of-the-box.
                    - listitem [ref=f1e339]:
                      - paragraph [ref=f1e340]:
                        - strong [ref=f1e341]: Native Browser Drivers
                        - text: ": Supports both Web USB API ("
                        - code [ref=f1e342]: navigator.usb
                        - text: ) and Web Serial API (
                        - code [ref=f1e343]: navigator.serial
                        - text: ).
                    - listitem [ref=f1e344]:
                      - paragraph [ref=f1e345]:
                        - strong [ref=f1e346]: 3 Print Modes
                        - text: ":"
                      - list [ref=f1e347]:
                        - listitem [ref=f1e348]:
                          - paragraph [ref=f1e349]: "Custom Formatted Text: Multiline text with alignment, bold font, line feeding, and paper cutting."
                        - listitem [ref=f1e350]:
                          - paragraph [ref=f1e351]: "Graphic Image / Canvas: Print HTML5 Canvas elements or Base64 images as high-precision thermal raster bitmaps."
                        - listitem [ref=f1e352]:
                          - paragraph [ref=f1e353]:
                            - text: "Raw ESC/POS Bytes: Pass raw"
                            - code [ref=f1e354]: Uint8Array
                            - text: command bytes directly to the printer.
                  - heading "Installation" [level=2] [ref=f1e355]
                  - code [ref=f1e357]: npm install web-thermal-printer
                  - heading "Quick Start" [level=2] [ref=f1e358]
                  - paragraph [ref=f1e359]: "Here is how you can quickly start printing with Web USB in a React/Vite TypeScript environment:"
                  - code [ref=f1e361]: "import { ThermalPrinterSDK, PrintPayload } from 'web-thermal-printer'; // 1. Instantiate SDK const printer = new ThermalPrinterSDK(); async function printReceipt() { // 2. Initialize WASM engine (Zero-config embedded WASM) await printer.init(); // 3. Connect via Web USB (Requires user gesture/button click in browser) await printer.connectUSB(1); // 4. Send Print Payload const payload: PrintPayload = { type: 'text', text: `TOKO UTAMA JAYA\\nJl. Mawar No. 88, Jakarta\\n--------------------------------\\nNo Nota : TRX-2026-001\\nKasir : Budi\\n--------------------------------\\nKopi Latte 2x @20.000 = 40.000\\nRoti Toast 1x @15.000 = 15.000\\n--------------------------------\\nTotal = 55.000\\n================================\\nTerima Kasih atas Kunjungan Anda!`, align: 'center', bold: true, cut: true, feed: 3, }; const bytesSent = await printer.print(payload); console.log(`Print successful! Sent ${bytesSent} bytes.`); }"
                  - heading "Supported Drivers & Connection Guide" [level=2] [ref=f1e362]
                  - paragraph [ref=f1e363]:
                    - text: Driver Browser API Target Devices When to Use
                    - strong [ref=f1e364]: Web USB
                    - code [ref=f1e365]: navigator.usb
                    - text: Pure USB Thermal Printers Recommended for standard USB thermal receipt printers.
                    - strong [ref=f1e366]: Web Serial
                    - code [ref=f1e367]: navigator.serial
                    - text: Virtual COM / Serial Ports (e.g.
                    - code [ref=f1e368]: /dev/cu.usbserial
                    - text: ","
                    - code [ref=f1e369]: COM3
                    - text: ) For printers connected via RS232 Serial cable or Serial-to-USB converters (CH340, FTDI).
                  - heading "Browser Security Policies & Local testing" [level=2] [ref=f1e370]
                  - paragraph [ref=f1e371]:
                    - text: Both Web USB and Web Serial APIs require a
                    - strong [ref=f1e372]: Secure Context (HTTPS or localhost)
                    - text: . If you are testing over local IP networks (HTTP), you must enable Chrome flag
                    - code [ref=f1e373]: chrome://flags/#unsafely-treat-insecure-origin-as-secure
                    - text: and add your origin to the allowlist.

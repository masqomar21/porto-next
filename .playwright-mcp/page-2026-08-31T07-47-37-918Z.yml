                - generic [ref=e464]:
                  - paragraph [ref=e465]: Printing to thermal receipt printers usually requires installing native desktop drivers or helper apps. However, modern web technologies now allow direct communication between the browser and hardware.
                  - paragraph [ref=e466]
                  - paragraph [ref=e467]: "### WebUSB vs Web Serial for Thermal Printers"
                  - paragraph [ref=e468]: "Two API options exist for browser-to-printer communication:"
                  - paragraph [ref=e469]: "- **WebUSB**: Provides low-level access to USB devices. Recommended for standard USB receipt printers."
                  - paragraph [ref=e470]: "- **Web Serial**: Provides access to serial ports. Best for older serial/RS-232 devices or microcontrollers."
                  - paragraph [ref=e471]
                  - paragraph [ref=e472]: WebUSB is generally preferred as most modern thermal printers connect via USB.
                  - paragraph [ref=e473]
                  - paragraph [ref=e474]: "### Understanding ESC/POS Commands"
                  - paragraph [ref=e475]: "Thermal printers speak **ESC/POS**, a command system developed by Epson. To print a receipt, we must send these raw binary bytes. For example:"
                  - paragraph [ref=e476]: "- **Initialize Printer**: `ESC @` (Hex `1B 40`)"
                  - paragraph [ref=e477]: "- **Print & Feed**: `LF` (Hex `0A`)"
                  - paragraph [ref=e478]: "- **Paper Cut**: `GS V` (Hex `1D 56`)"
                  - paragraph [ref=e479]
                  - paragraph [ref=e480]: Generating these binary arrays manually is tedious and error-prone.
                  - paragraph [ref=e481]
                  - paragraph [ref=e482]: "### Introducing `web-thermal-printer`"
                  - paragraph [ref=e483]: "To simplify receipt compilation and printing, we can use the open-source library [`web-thermal-printer`](https://github.com/masqomar21/web-thermal-printer)."

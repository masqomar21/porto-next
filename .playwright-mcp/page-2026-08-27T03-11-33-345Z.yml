                  - heading "Introduction" [level=2] [ref=f16e155]
                  - paragraph [ref=f16e156]:
                    - strong [ref=f16e157]: web-thermal-printer
                    - text: is a lightweight, zero-configuration WebAssembly SDK that connects your web applications (React, Vue, Next.js, Angular, Svelte, or plain JS/TS) directly to ESC/POS Thermal Receipt Printers via Web USB or Web Serial API. No background desktop software installation is required on client machines!
                  - heading "Key Features" [level=2] [ref=f16e158]
                  - list [ref=f16e159]:
                    - listitem [ref=f16e160]:
                      - paragraph [ref=f16e161]:
                        - strong [ref=f16e162]: Zero-Config Embedded WASM
                        - text: ":"
                        - code [ref=f16e163]: printer.wasm
                        - text: is Base64 embedded inside the npm bundle. Call
                        - code [ref=f16e164]: await printer.init()
                        - text: without copying
                        - code [ref=f16e165]: .wasm
                        - text: files or configuring bundlers (Vite, Next.js, Webpack, etc.).
                    - listitem [ref=f16e166]:
                      - paragraph [ref=f16e167]:
                        - strong [ref=f16e168]: 100% TypeScript Ready
                        - text: ": Includes strict TypeScript type declarations ("
                        - code [ref=f16e169]: dist/index.d.ts
                        - text: ) out-of-the-box.
                    - listitem [ref=f16e170]:
                      - paragraph [ref=f16e171]:
                        - strong [ref=f16e172]: Native Browser Drivers
                        - text: ": Supports both Web USB API ("
                        - code [ref=f16e173]: navigator.usb
                        - text: ) and Web Serial API (
                        - code [ref=f16e174]: navigator.serial
                        - text: ).
                    - listitem [ref=f16e175]:

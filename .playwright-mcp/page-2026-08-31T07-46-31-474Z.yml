                - generic [ref=e266]:
                  - paragraph [ref=e305]: Printing to thermal receipt printers usually requires installing native desktop drivers or helper apps. However, modern web technologies now allow direct communication between the browser and hardware.
                  - paragraph [ref=e306]
                  - paragraph [ref=e307]: "### WebUSB vs Web Serial for Thermal Printers"
                  - paragraph [ref=e308]: "Two API options exist for browser-to-printer communication:"
                  - paragraph [ref=e309]: "- **WebUSB**: Provides low-level access to USB devices. Recommended for standard USB receipt printers."
                  - paragraph [ref=e310]: "- **Web Serial**: Provides access to serial ports. Best for older serial/RS-232 devices or microcontrollers."
                  - paragraph [ref=e311]
                  - paragraph [ref=e312]: WebUSB is generally preferred as most modern thermal printers connect via USB.
                  - paragraph [ref=e313]
                  - paragraph [ref=e314]: "### Understanding ESC/POS Commands"
                  - paragraph [ref=e315]: "Thermal printers speak **ESC/POS**, a command system developed by Epson. To print a receipt, we must send these raw binary bytes. For example:"
                  - paragraph [ref=e316]: "- **Initialize Printer**: `ESC @` (Hex `1B 40`)"
                  - paragraph [ref=e317]: "- **Print & Feed**: `LF` (Hex `0A`)"
                  - paragraph [ref=e318]: "- **Paper Cut**: `GS V` (Hex `1D 56`)"
                  - paragraph [ref=e319]
                  - paragraph [ref=e320]: Generating these binary arrays manually is tedious and error-prone.
                  - paragraph [ref=e321]
                  - paragraph [ref=e322]: "### Introducing `web-thermal-printer`"
                  - paragraph [ref=e323]: "To simplify receipt compilation and printing, we can use the open-source library [`web-thermal-printer`](https://github.com/masqomar21/web-thermal-printer)."

                - generic [ref=f1e153]:
                  - paragraph [ref=f1e284]: Mencetak struk belanja menggunakan printer thermal biasanya mengharuskan kita memasang driver desktop native atau aplikasi pembantu khusus. Namun, teknologi web modern sekarang memungkinkan komunikasi langsung dari browser ke perangkat keras tanpa software perantara.
                  - paragraph [ref=f1e285]
                  - paragraph [ref=f1e286]: "### WebUSB vs Web Serial untuk Printer Thermal"
                  - paragraph [ref=f1e287]: "Terdapat dua opsi API utama di browser untuk berkomunikasi dengan printer thermal:"
                  - paragraph [ref=f1e288]: "- **WebUSB**: Menyediakan akses tingkat rendah ke perangkat USB. Direkomendasikan untuk printer thermal USB standar."
                  - paragraph [ref=f1e289]: "- **Web Serial**: Menyediakan akses ke serial port. Cocok untuk perangkat serial/RS-232 lama atau mikrokontroler."
                  - paragraph [ref=f1e290]
                  - paragraph [ref=f1e291]: Secara umum, WebUSB lebih sering digunakan karena mayoritas printer thermal modern saat ini terhubung via port USB.
                  - paragraph [ref=f1e292]
                  - paragraph [ref=f1e293]: "### Memahami Perintah ESC/POS"
                  - paragraph [ref=f1e294]: "Printer thermal berkomunikasi menggunakan command set **ESC/POS** yang dikembangkan oleh Epson. Untuk mencetak struk, kita harus mengirimkan deretan byte biner ini secara langsung. Contohnya:"
                  - paragraph [ref=f1e295]: "- **Inisialisasi Printer**: `ESC @` (Hex `1B 40`)"
                  - paragraph [ref=f1e296]: "- **Cetak & Ganti Baris**: `LF` (Hex `0A`)"
                  - paragraph [ref=f1e297]: "- **Potong Kertas**: `GS V` (Hex `1D 56`)"
                  - paragraph [ref=f1e298]
                  - paragraph [ref=f1e299]: Menyusun perintah biner ini secara manual sangat rumit dan rawan kesalahan.
                  - paragraph [ref=f1e300]
                  - paragraph [ref=f1e301]: "### Solusi Praktis: Menggunakan `web-thermal-printer`"
                  - paragraph [ref=f1e302]: "Untuk mempermudah pembuatan format struk dan pengiriman data biner tersebut, kita dapat menggunakan library open-source [`web-thermal-printer`](https://github.com/masqomar21/web-thermal-printer)."
                  - paragraph [ref=f1e303]
                  - paragraph [ref=f1e304]: "#### Cara Instalasi"
                  - paragraph [ref=f1e305]: "```bash"
                  - paragraph [ref=f1e306]: npm install web-thermal-printer
                  - paragraph [ref=f1e307]: "```"
                  - paragraph [ref=f1e308]
                  - paragraph [ref=f1e309]: "#### Contoh Penerapan di React"

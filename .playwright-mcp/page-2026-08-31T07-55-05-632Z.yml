                  - paragraph [ref=f1e913]
                  - paragraph [ref=f1e914]: "### Tips Tambahan saat Menggunakan WebUSB"
                  - paragraph [ref=f1e915]: "1. **Keamanan (HTTPS)**: WebUSB API hanya aktif pada environment secure context (HTTPS) atau `localhost` selama proses development."
                  - paragraph [ref=f1e916]: "2. **Koneksi Endpoint**: Setiap printer thermal memiliki alamat endpoint USB transfer out yang berbeda. Jika pengiriman gagal di endpoint `1`, coba ganti indeks target transfer out Anda (misal `2` atau `3`)."
                  - paragraph [ref=f1e917]: "3. **Karakter Non-ASCII**: Pastikan encoding printer sesuai sebelum mengirim karakter khusus atau simbol mata uang non-standar."

                - generic [ref=f1e793]:
                  - paragraph [ref=f1e794]: Mencetak struk belanja menggunakan printer thermal biasanya mengharuskan kita memasang driver desktop native atau aplikasi pembantu khusus seperti QZ Tray atau print server lokal. Namun, teknologi web modern sekarang memungkinkan komunikasi langsung dari browser ke perangkat keras tanpa software perantara apa pun.
                  - paragraph [ref=f1e795]
                  - paragraph [ref=f1e796]: "### WebUSB vs Web Serial untuk Printer Thermal"
                  - paragraph [ref=f1e797]: "Terdapat dua opsi API utama di browser untuk berkomunikasi dengan printer thermal:"
                  - paragraph [ref=f1e798]: "- **WebUSB**: Menyediakan akses tingkat rendah ke perangkat USB. Direkomendasikan untuk printer thermal USB standar yang terhubung langsung menggunakan kabel data USB. API ini lebih aman dan standar untuk perangkat POS (Point of Sale) modern."
                  - paragraph [ref=f1e799]: "- **Web Serial**: Menyediakan akses ke serial port komunikasi. Sangat berguna jika Anda menggunakan printer thermal model lama yang memakai interface serial/RS-232, atau jika Anda menghubungkannya melalui modul adapter Bluetooth/Serial ke mikrokontroler."
                  - paragraph [ref=f1e800]
                  - paragraph [ref=f1e801]: Secara umum, WebUSB lebih sering digunakan karena mayoritas printer thermal modern saat ini menggunakan konektor USB.
                  - paragraph [ref=f1e802]
                  - paragraph [ref=f1e803]: "### Bagaimana WebUSB Berinteraksi dengan Perangkat Keras?"
                  - paragraph [ref=f1e804]: "WebUSB bekerja dengan mengirimkan transfer data USB langsung ke endpoint interface perangkat. Protokol ini membutuhkan beberapa tahapan:"
                  - paragraph [ref=f1e805]: "1. **Request Device**: Meminta izin user melalui dialog sistem browser untuk memilih perangkat USB yang terdeteksi."
                  - paragraph [ref=f1e806]: "2. **Open Session**: Membuka koneksi ke perangkat."
                  - paragraph [ref=f1e807]: "3. **Select Configuration**: Memilih konfigurasi aktif perangkat USB (biasanya indeks `1`)."
                  - paragraph [ref=f1e808]: "4. **Claim Interface**: Meminta kendali eksklusif atas interface printer (biasanya indeks `0`)."
                  - paragraph [ref=f1e809]: "5. **Transfer Out**: Mengirim byte data ke endpoint keluar (USB bulk transfer out)."
                  - paragraph [ref=f1e810]
                  - paragraph [ref=f1e811]: "### Memahami Perintah ESC/POS"
                  - paragraph [ref=f1e812]: Printer thermal tidak menerima teks biasa atau HTML. Printer ini berkomunikasi menggunakan command set **ESC/POS** (Escape/Point of Sale) yang dikembangkan oleh Epson. Untuk mencetak struk, kita harus merancang struk menggunakan kode perintah biner tertentu lalu mengirimkannya.
                  - paragraph [ref=f1e813]
                  - paragraph [ref=f1e814]: "Contoh perintah dasar ESC/POS:"
                  - paragraph [ref=f1e815]: "- **Inisialisasi Printer**: `ESC @` (Hex `1B 40`) - Digunakan untuk mereset buffer dan seting printer ke mode awal."
                  - paragraph [ref=f1e816]: "- **Perataan Teks (Alignment)**: `ESC a n` (Hex `1B 61 n`) - Di mana `n` bernilai `0` untuk rata kiri, `1` tengah, dan `2` rata kanan."
                  - paragraph [ref=f1e817]: "- **Cetak & Ganti Baris**: `LF` (Hex `0A`) - Menginstrukan printer untuk mencetak baris teks saat ini dan memajukan kertas satu baris."
                  - paragraph [ref=f1e818]: "- **Potong Kertas (Cut)**: `GS V m n` (Hex `1D 56 m n`) - Menginstruksikan printer yang mendukung auto-cutter untuk memotong kertas."
                  - paragraph [ref=f1e819]
                  - paragraph [ref=f1e820]: Menyusun byte biner ini satu per satu secara manual sangat melelahkan dan rawan bug.
                  - paragraph [ref=f1e821]
                  - paragraph [ref=f1e822]: "### Solusi Praktis: Library `web-thermal-printer`"
                  - paragraph [ref=f1e823]: "Untuk mempermudah pembuatan format struk belanja tanpa harus pusing memikirkan konversi byte biner ESC/POS secara manual, kita dapat menggunakan library open-source [`web-thermal-printer`](https://github.com/masqomar21/web-thermal-printer). Library ini menyediakan API chainable yang intuitif untuk menghasilkan bytecode ESC/POS yang siap dikirim langsung ke printer."
                  - paragraph [ref=f1e824]
                  - paragraph [ref=f1e825]: "#### Cara Instalasi"
                  - paragraph [ref=f1e826]: "Cukup jalankan perintah berikut di proyek React atau project JavaScript Anda:"
                  - paragraph [ref=f1e827]: "```bash"
                  - paragraph [ref=f1e828]: npm install web-thermal-printer
                  - paragraph [ref=f1e829]: "```"
                  - paragraph [ref=f1e830]
                  - paragraph [ref=f1e831]: "#### Contoh Penerapan Lengkap di React"

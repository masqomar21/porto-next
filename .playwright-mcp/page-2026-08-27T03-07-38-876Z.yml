                  - heading "Quick Start" [level=2] [ref=f1e494]
                  - paragraph [ref=f1e495]: "Here is how you can quickly start printing with Web USB in a React/Vite TypeScript environment:"
                  - code [ref=f1e497]: "import { ThermalPrinterSDK, PrintPayload } from 'web-thermal-printer'; // 1. Instantiate SDK const printer = new ThermalPrinterSDK(); async function printReceipt() { // 2. Initialize WASM engine (Zero-config embedded WASM) await printer.init(); // 3. Connect via Web USB (Requires user gesture/button click in browser) await printer.connectUSB(1); // 4. Send Print Payload const payload: PrintPayload = { type: 'text', text: `TOKO UTAMA JAYA\\nJl. Mawar No. 88, Jakarta\\n--------------------------------\\nNo Nota : TRX-2026-001\\nKasir : Budi\\n--------------------------------\\nKopi Latte 2x @20.000 = 40.000\\nRoti Toast 1x @15.000 = 15.000\\n--------------------------------\\nTotal = 55.000\\n================================\\nTerima Kasih atas Kunjungan Anda!`, align: 'center', bold: true, cut: true, feed: 3, }; const bytesSent = await printer.print(payload); console.log(`Print successful! Sent ${bytesSent} bytes.`); }"

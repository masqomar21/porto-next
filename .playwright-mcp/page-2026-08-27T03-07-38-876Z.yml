                  - paragraph [ref=f1e461]:
                    - strong [ref=f1e462]: web-thermal-printer
                    - text: is a lightweight, zero-configuration WebAssembly SDK that connects your web applications (React, Vue, Next.js, Angular, Svelte, or plain JS/TS) directly to ESC/POS Thermal Receipt Printers via Web USB or Web Serial API. No background desktop software installation is required on client machines!
